<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>VidPlaying</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;text-align:center}
.box{max-width:600px;margin:40px auto;padding:20px}
.thumb{width:100%;height:340px;background:#111;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-direction:column;border:1px solid #222}
.play{width:80px;height:80px;background:#e50914;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;cursor:pointer;margin-bottom:20px}
.btn{background:#e50914;color:#fff;padding:14px 30px;border-radius:30px;text-decoration:none;font-weight:bold;display:inline-block;margin-top:20px}
iframe{width:100%;height:360px;border:0;border-radius:12px;display:none}
</style>
</head>
<body>
<div class="box">
<h2>VIDEO PLAYER</h2>

<div class="thumb" id="cover">
<div class="play" onclick="playVid()">▶</div>
<p>Klik Play untuk Nonton<br>dit4rvpol7vn</p>
</div>

<iframe id="player" src="" allowfullscreen></iframe>

<a class="btn" href="https://vski.cc/e/dit4rvpol7vn" target="_blank">Buka Fullscreen</a>
</div>

<script>
function playVid(){
 document.getElementById('cover').style.display='none';
 var p = document.getElementById('player');
 p.style.display='block';
 p.src='https://vski.cc/e/dit4rvpol7vn';
}
</script>
</body>
</html>
